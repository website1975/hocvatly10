<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Trắc Nghiệm Vật Lý</title>
    <!-- Tailwind CSS cho giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- MathJax để render công thức toán học -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Câu Hỏi Trắc Nghiệm Vật Lý</h1>
            <p class="text-slate-500">Nhấn vào nút "Xem lời giải chi tiết" để kiểm tra đáp án của bạn</p>
        </header>

        <div id="quiz-container" class="space-y-6">
            <!-- Các câu hỏi sẽ được render ở đây bằng Javascript -->
        </div>
    </div>

    <script>
        // Dữ liệu các câu hỏi trích xuất từ file của bạn
        // (Tôi đã bổ sung thêm lời giải cho câu 4 dựa trên kiến thức Vật lý để file hoàn thiện hơn)
        const questions = [
            {
                id: 1,
                question: "Câu 1. Trong một từ trường đều, một electron chuyển động tròn đều chỉ do tác dụng của lực từ. Phát biểu nào sau đây là đúng?",
                options: [
                    "A. Gia tốc của hạt không đổi.",
                    "B. Động năng của hạt tăng.",
                    "C. Lực từ không sinh công.",
                    "D. Vận tốc của hạt không đổi."
                ],
                solution: "Lực từ (lực Lorentz) luôn vuông góc với vectơ vận tốc chuyển động của hạt mang điện. Do đó, công của lực từ sinh ra bằng không $(A=0)$. Theo định lý động năng, động năng của electron không đổi, tốc độ không đổi (chỉ có hướng vận tốc và hướng gia tốc thay đổi liên tục).",
                answer: "C"
            },
            {
                id: 2,
                question: "Câu 2. Khi ở gần nhau,",
                options: [
                    "A. hai dòng điện cùng chiều đẩy nhau.",
                    "B. hai điện tích cùng dấu hút nhau.",
                    "C. hai dòng điện ngược chiều hút nhau.",
                    "D. hai cực cùng loại của hai nam châm đẩy nhau."
                ],
                solution: "Theo đặc điểm tương tác từ: Hai cực từ cùng loại (Bắc - Bắc hoặc Nam - Nam) của hai nam châm khi đặt gần nhau sẽ sinh ra lực từ đấy nhau. (Ngược lại, hai dòng điện cùng chiều thì hút nhau, ngược chiều đẩy nhau; điện tích cùng dấu đẩy nhau).",
                answer: "D"
            },
            {
                id: 3,
                question: "Câu 3. Khi nói về dòng điện xoay chiều, phát biểu nào sau đây là đúng?",
                options: [
                    "A. Giá trị hiệu dụng của điện áp bằng một nửa giá trị cực đại.",
                    "B. Công suất toả nhiệt ở điện trở R tỉ lệ thuận với cường độ hiệu dụng của dòng điện qua điện trở.",
                    "C. Giá trị hiệu dụng của dòng điện bằng một nửa giá trị cực đại.",
                    "D. Cường độ dòng điện biến thiên điều hoà theo thời gian theo định luật dạng sin (hoặc cosin)."
                ],
                solution: "Theo định nghĩa SGK, dòng điện xoay chiều là dòng điện có cường độ biến thiên điều hoà theo thời gian theo định luật dạng sin hoặc cosin.",
                answer: "D"
            },
            {
                id: 4,
                question: "Câu 4. Một khối khí lí tưởng bị nén trong xilanh kín. Nội năng của khối khí",
                options: [
                    "A. giảm do khối khí nhận công.",
                    "B. tăng do khối khí nhận công.",
                    "C. tăng, nếu xilanh cách nhiệt.",
                    "D. không đổi, nếu xilanh cách nhiệt."
                ],
                solution: "Theo nguyên lý I Nhiệt động lực học ($\\Delta U = A + Q$). Do khối khí bị nén nên nhận công ($A > 0$). Nếu xilanh cách nhiệt thì không trao đổi nhiệt ($Q = 0$). Suy ra $\\Delta U = A > 0$, tức là nội năng của khối khí tăng.",
                answer: "C"
            }
        ];

        const container = document.getElementById('quiz-container');

        // Hàm render giao diện
        function renderQuestions() {
            let htmlContent = '';

            questions.forEach((q) => {
                let optionsHtml = q.options.map(opt => `
                    <div class="p-3 border border-slate-200 rounded-lg text-slate-700 bg-slate-50 hover:bg-blue-50 transition-colors">
                        ${opt}
                    </div>
                `).join('');

                htmlContent += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-6 transition-all hover:shadow-md">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">${q.question}</h3>
                        
                        <div class="space-y-2 mb-5">
                            ${optionsHtml}
                        </div>

                        <button 
                            id="btn-${q.id}" 
                            onclick="toggleSolution(${q.id})"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-blue-700 bg-blue-100 rounded-lg hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                        >
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <span>Xem lời giải chi tiết</span>
                        </button>

                        <div id="solution-${q.id}" class="hidden fade-in mt-4 p-4 rounded-lg bg-green-50 border border-green-200">
                            <p class="text-slate-800 mb-2"><strong>Hướng dẫn giải:</strong> ${q.solution}</p>
                            <p class="text-slate-800 font-medium">Chọn đáp án: <span class="text-red-600 font-bold text-lg">${q.answer}</span></p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // Hàm ẩn/hiện lời giải
        function toggleSolution(id) {
            const solDiv = document.getElementById(`solution-${id}`);
            const btnSpan = document.querySelector(`#btn-${id} span`);
            const btnIcon = document.querySelector(`#btn-${id} svg`);

            if (solDiv.classList.contains('hidden')) {
                solDiv.classList.remove('hidden');
                btnSpan.textContent = 'Ẩn lời giải';
                btnIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                `;
            } else {
                solDiv.classList.add('hidden');
                btnSpan.textContent = 'Xem lời giải chi tiết';
                btnIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }

        // Chạy hàm render khi trang web tải xong
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            // Yêu cầu MathJax format lại các công thức toán học sau khi render HTML
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
